name: Build and Release

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web-and-test:
    name: Web Build, Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter (oxlint)
        run: npm run lint

      - name: Run unit test suite (vitest)
        run: npm run test

      - name: Build web application
        run: npm run build

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 14

  build-android:
    name: Android APK Build
    needs: build-web-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Download web build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Mirror web build to Android assets
        run: |
          mkdir -p android-app/app/src/main/assets/web/assets
          cp -r dist/* android-app/app/src/main/assets/web/

      - name: Make Gradle wrapper executable
        run: chmod +x android-app/gradlew

      - name: Build Android Debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and prepare APK
        run: |
          mkdir -p build-output
          cp android-app/app/build/outputs/apk/debug/app-debug.apk build-output/KuchhBhii-debug.apk
          ls -la build-output/

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build-output/KuchhBhii-debug.apk
          retention-days: 14

  create-github-release:
    name: Create GitHub Release
    needs: [build-web-and-test, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download web build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist-release

      - name: Download Android APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apk-release

      - name: Package web distribution
        run: |
          cd dist-release && zip -r ../kuchhbhii-web-${{ github.ref_name }}.zip . && cd ..
          cp apk-release/KuchhBhii-debug.apk KuchhBhii-${{ github.ref_name }}.apk
          if [ -f "release_notes_${{ github.ref_name }}.md" ]; then
            cp "release_notes_${{ github.ref_name }}.md" release_notes.md
          else
            echo "Release ${{ github.ref_name }}" > release_notes.md
          fi

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            KuchhBhii-${{ github.ref_name }}.apk
            kuchhbhii-web-${{ github.ref_name }}.zip
          name: Kuchh Bhii ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
